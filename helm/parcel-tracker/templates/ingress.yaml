{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "parcel-tracker.fullname" . }}
  labels:
    {{- include "parcel-tracker.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- if .Values.ingress.labHost }}
    - host: {{ .Values.ingress.labHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "parcel-tracker.fullname" . }}-api
                port:
                  number: 80
    {{- end }}
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "parcel-tracker.fullname" . }}-api
                port:
                  number: 80
  {{- if .Values.ingress.tls.enabled }}
  # TLS csak a publikus hostra — a .lab.local címre a Let's Encrypt HTTP-01
  # kihívása nem teljesíthető.
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
