# Redis mint materializált nézet + cache. Tudatosan nincs perzisztencia:
# a forrás igazsága a Kafka topic, a nézet visszajátszással újraépíthető
# (ez az egyik hands-on gyakorlat).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "parcel-tracker.fullname" . }}-redis
  labels:
    app: {{ include "parcel-tracker.fullname" . }}-redis
    {{- include "parcel-tracker.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "parcel-tracker.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "parcel-tracker.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args:
            - redis-server
            - --appendonly
            - "no"
            - --maxmemory
            - {{ .Values.redis.maxMemory | quote }}
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "parcel-tracker.fullname" . }}-redis
  labels:
    app: {{ include "parcel-tracker.fullname" . }}-redis
    {{- include "parcel-tracker.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "parcel-tracker.fullname" . }}-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
